spring.application.name=chatLocal

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:chatlocal}
spring.datasource.username=${DB_USER:chatlocal}
spring.datasource.password=${DB_PASSWORD}

# Le schéma est créé par les migrations Flyway (src/main/resources/db/migration).
# Hibernate se contente de vérifier que les entités correspondent aux tables.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Pour une base déjà créée avant Flyway : on la déclare "version 0" puis on applique les migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
