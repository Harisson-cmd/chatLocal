spring.application.name=chatLocal

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:chatlocal}
spring.datasource.username=${DB_USER:chatlocal}
spring.datasource.password=${DB_PASSWORD}

# Provisoire : Vidouelle mettra en place les migrations versionnées
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000