spring.application.name=chatLocal

# Base de données PostgreSQL (seul le mot de passe est obligatoire en variable d'environnement)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatlocal}
spring.datasource.username=${DB_USER:chatlocal}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false